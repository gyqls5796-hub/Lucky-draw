<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카드 디자인 한눈에 보기</title>
    <style>
        body { display: flex; gap: 20px; justify-content: center; align-items: center; height: 100vh; background-color: #1a1a2e; font-family: sans-serif; }
        .card { width: 160px; height: 260px; background: #ffffff; border: 3px solid #f39c12; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 15px; box-sizing: border-box; }
        .card-icon { font-size: 50px; margin-bottom: 10px; height: 60px; display: flex; align-items: center; justify-content: center; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #2c3e50; }
        .card-desc { font-size: 11px; color: #666; word-break: keep-all; line-height: 1.4;}
    </style>
</head>
<body>
    <div class="card">
        <div class="card-icon">💉</div>
        <div class="card-title">주사기</div>
        <div class="card-desc">예방접종을 통해 질병을 미리 예방하세요.</div>
    </div>
    
    <div class="card">
        <div class="card-icon">
            <svg width="55" height="55" viewBox="0 0 24 24" fill="#e2e8f0" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="2" ry="2"></rect><path d="M3 10h18M3 14h18M2 7l2-2M22 7l-2-2M2 17l2 2M22 17l-2 2"></path></svg>
        </div>
        <div class="card-title">마스크</div>
        <div class="card-desc">기침예절을 지켜 모두의 건강을 보호하세요.</div>
    </div>

    <div class="card">
        <div class="card-icon">
            <svg width="55" height="55" viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path><path d="M14 10V5a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v4"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"></path><path d="M6 13.5V9a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v7.5"></path><path d="M20.5 14.5c-.8-1.5-2.5-2.5-4.5-2.5h-1"></path><path d="M4 16.5A4.5 4.5 0 0 0 8.5 21h7a4.5 4.5 0 0 0 4.5-4.5v-2"></path><circle cx="18" cy="5" r="1.5" fill="#3498db" stroke="none"></circle><circle cx="21" cy="8" r="1.2" fill="#3498db" stroke="none"></circle><circle cx="15" cy="2" r="1" fill="#3498db" stroke="none"></circle><circle cx="6" cy="4" r="1.5" fill="#3498db" stroke="none"></circle><circle cx="3" cy="7" r="1" fill="#3498db" stroke="none"></circle></svg>
        </div>
        <div class="card-title">손씻기</div>
        <div class="card-desc">흐르는 물에 비누로 30초 이상 손씻기!</div>
    </div>
</body>
</html>
