<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>건강 타로 카드 뽑기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

        body { margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #1a1a2e; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; color: white; -webkit-user-select: none; user-select: none; }
        
        .header-text { margin-bottom: 20px; font-size: 24px; font-weight: 700; text-align: center; z-index: 10; transition: opacity 0.3s ease; }
        
        #loadingText { font-size: 16px; color: #f39c12; margin-bottom: 20px; animation: pulse 1.5s infinite; text-align: center; line-height: 1.5; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        
        .card-container { display: flex; gap: 20px; position: relative; }
        .card { width: 160px; height: 260px; perspective: 1000px; cursor: pointer; transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.4s; position: relative; transform-origin: center center; --move-x: 0px; --move-y: 0px; -webkit-tap-highlight-color: transparent; }
        .card.active { transform: translate(var(--move-x), var(--move-y)) scale(2.6); z-index: 100; }
        .card-container.has-active .card:not(.active) { opacity: 0; pointer-events: none; }
        .card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1); transform-style: preserve-3d; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-radius: 15px; }
        .card.active .card-inner, .result-card .card-inner { transform: rotateY(180deg); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .card-front, .card-back { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 15px; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        .card-front { background: linear-gradient(135deg, #2c3e50, #4ca1af); border: 2px solid #f39c12; color: #f39c12; font-size: 40px; }
        .card-front::after { content: "✨"; }
        .card-back { background: #ffffff; color: #333; transform: rotateY(180deg); border: 2px solid #ddd; }
        
        /* 아이콘 영역 설정 */
        .card-icon { font-size: 50px; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; height: 60px; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: #2c3e50; }
        .card-desc { font-size: 11px; color: #666; word-break: keep-all; line-height: 1.4; }
        
        #resultScreen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100vh; position: absolute; top: 0; left: 0; background-color: #1a1a2e; z-index: 200; gap: 250px; padding-bottom: 60px; box-sizing: border-box; }
        .result-message { font-size: 24px; color: #f39c12; font-weight: bold; text-align: center; line-height: 1.5; z-index: 201; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; padding: 10px; }
        .result-message span { font-size: 16px; color: #ffffff; font-weight: normal; }
        .result-card { transform: scale(2.6); pointer-events: none; }
        
        @media (max-width: 600px) { .card-container { gap: 12px; } .card { width: 100px; height: 160px; } .card.active { transform: translate(var(--move-x), var(--move-y)) scale(3.2); } .card-icon { font-size: 35px; height: 45px; margin-bottom: 5px; } .card-title { font-size: 13px; margin-bottom: 4px; } .card-desc { font-size: 9px; } .result-card { transform: scale(3.2); } #resultScreen { gap: 220px; padding-bottom: 80px; } .result-message { font-size: 20px; } .result-message span { font-size: 14px; } }
    </style>
</head>
<body>

    <div class="header-text" id="headerText" style="display: none;">당신의 건강 타로를 1장 뽑아보세요</div>
    <div id="loadingText">현재 남은 상품 수량을 파악 중입니다... ⏳</div>
    <div class="card-container" id="cardContainer" style="display: none;"></div>

    <div id="resultScreen">
        <div class="result-message" onclick="secretReset()">
            이미 참여하셨습니다!<br>
            <span>진행요원에게 이 화면을 보여주시고 선물을 수령하세요.</span>
        </div>
        <div class="card result-card">
            <div class="card-inner">
                <div class="card-front"></div>
                <div class="card-back" style="border: 3px solid #f39c12;">
                    <div class="card-icon" id="finalIcon"></div>
                    <div class="card-title" id="finalTitle"></div>
                    <div class="card-desc" id="finalDesc"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbwvmj7IACrkA8kCeLrigXpbWtL9OQGvdroKK2ZAK8RnhttJ4NeN6cuAMg8U-LZiDhw/exec"; 

        // 💡 손과 물 -> 손씻기로 변경 및 수량 유지
        const MAX_LIMITS = { '주사기': 200, '마스크': 300, '손씻기': 100 };

        // 🎨 직접 그린 깨지지 않는 고화질 아이콘 (얼굴 없는 마스크 & 거품 묻은 손)
        const svgMask = `<svg width="55" height="55" viewBox="0 0 24 24" fill="#e2e8f0" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="2" ry="2"></rect><path d="M3 10h18M3 14h18M2 7l2-2M22 7l-2-2M2 17l2 2M22 17l-2 2"></path></svg>`;
        
        const svgWash = `<svg width="55" height="55" viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path><path d="M14 10V5a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v4"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"></path><path d="M6 13.5V9a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v7.5"></path><path d="M20.5 14.5c-.8-1.5-2.5-2.5-4.5-2.5h-1"></path><path d="M4 16.5A4.5 4.5 0 0 0 8.5 21h7a4.5 4.5 0 0 0 4.5-4.5v-2"></path><circle cx="18" cy="5" r="1.5" fill="#3498db" stroke="none"></circle><circle cx="21" cy="8" r="1.2" fill="#3498db" stroke="none"></circle><circle cx="15" cy="2" r="1" fill="#3498db" stroke="none"></circle><circle cx="6" cy="4" r="1.5" fill="#3498db" stroke="none"></circle><circle cx="3" cy="7" r="1" fill="#3498db" stroke="none"></circle></svg>`;

        // 💡 나중에 이미지를 바꾸고 싶으시다면 svgMask 부분 대신 `<img src="이미지주소.jpg" width="50">` 처럼 넣으시면 됩니다.
        const cardsData = {
            '주사기': { icon: '💉', desc: '예방접종을 통해 질병을 미리 예방하세요.' },
            '마스크': { icon: svgMask, desc: '기침예절을 지켜 모두의 건강을 보호하세요.' },
            '손씻기': { icon: svgWash, desc: '흐르는 물에 비누로 30초 이상 손씻기!' }
        };

        let isDrawing = false; 
        let cardsRendered = false; 

        window.onload = function() {
            const savedCardName = localStorage.getItem('drawnCardName');
            if (savedCardName && cardsData[savedCardName]) {
                document.getElementById('loadingText').style.display = 'none';
                showResultScreen(savedCardName);
                return;
            }

            const loadingTimeout = setTimeout(() => {
                if (!cardsRendered) {
                    console.log("3초 초과! 강제 진행");
                    let fallbackPool = ['주사기', '마스크', '손씻기'].sort(() => Math.random() - 0.5);
                    renderCards(fallbackPool);
                }
            }, 3000); 

            const noCacheURL = scriptURL + "?t=" + new Date().getTime();

            fetch(noCacheURL)
                .then(response => {
                    if (!response.ok) throw new Error("네트워크 응답 에러");
                    return response.json();
                })
                .then(counts => {
                    if (cardsRendered) return; 
                    clearTimeout(loadingTimeout); 

                    let availableItems = [];
                    for (let key in MAX_LIMITS) {
                        let currentCount = counts[key] || 0;
                        if (currentCount < MAX_LIMITS[key]) {
                            availableItems.push(key);
                        }
                    }

                    if (availableItems.length === 0) {
                        document.getElementById('loadingText').style.display = 'none';
                        document.getElementById('headerText').style.display = 'block';
                        document.getElementById('headerText').innerText = "모든 상품이 소진되었습니다 😭";
                        return;
                    }

                    let drawPool = [];
                    availableItems.forEach(item => {
                        if (drawPool.length < 3) drawPool.push(item);
                    });
                    
                    while (drawPool.length < 3) {
                        let randomFallback = availableItems[Math.floor(Math.random() * availableItems.length)];
                        drawPool.push(randomFallback);
                    }

                    renderCards(drawPool.sort(() => Math.random() - 0.5));
                })
                .catch(error => {
                    if (cardsRendered) return;
                    clearTimeout(loadingTimeout);
                    console.error('수량 체크 에러 (강제 진행):', error);
                    let fallbackPool = ['주사기', '마스크', '손씻기'].sort(() => Math.random() - 0.5);
                    renderCards(fallbackPool);
                });
        };

        function showResultScreen(cardName) {
            document.getElementById('finalIcon').innerHTML = cardsData[cardName].icon;
            document.getElementById('finalTitle').innerText = cardName;
            document.getElementById('finalDesc').innerText = cardsData[cardName].desc;
            document.getElementById('resultScreen').style.display = 'flex';
        }

        function renderCards(cardNames) {
            cardsRendered = true; 
            document.getElementById('loadingText').style.display = 'none';
            document.getElementById('headerText').style.display = 'block';
            
            const container = document.getElementById('cardContainer');
            container.style.display = 'flex';
            container.innerHTML = ''; 

            cardNames.forEach(cardName => {
                const data = cardsData[cardName];
                const cardHTML = `
                    <div class="card" onclick="selectCard(this, '${cardName}')">
                        <div class="card-inner">
                            <div class="card-front"></div>
                            <div class="card-back">
                                <div class="card-icon">${data.icon}</div>
                                <div class="card-title">${cardName}</div>
                                <div class="card-desc">${data.desc}</div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function selectCard(selectedCard, cardName) {
            if (isDrawing || localStorage.getItem('drawnCardName')) return;
            isDrawing = true;

            const container = document.getElementById('cardContainer');
            const header = document.getElementById('headerText');
            
            const rect = selectedCard.getBoundingClientRect();
            const cardCenterX = rect.left + (rect.width / 2);
            const cardCenterY = rect.top + (rect.height / 2);
            const screenCenterX = window.innerWidth / 2;
            const screenCenterY = window.innerHeight / 2;
            
            selectedCard.style.setProperty('--move-x', (screenCenterX - cardCenterX) + 'px');
            selectedCard.style.setProperty('--move-y', (screenCenterY - cardCenterY) + 'px');

            selectedCard.classList.add('active');
            container.classList.add('has-active');
            
            localStorage.setItem('drawnCardName', cardName);

            header.style.opacity = '0';
            setTimeout(() => {
                header.innerText = cardName + " 카드를 뽑으셨습니다!";
                header.style.opacity = '1';
            }, 300);

            const formData = new FormData();
            formData.append('cardName', cardName);

            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors',
                body: formData
            }).catch(error => console.log('에러 발생!', error));
        }

        let resetClickCount = 0;
        let resetTimer;

        function secretReset() {
            resetClickCount++;
            clearTimeout(resetTimer); 
            
            if (resetClickCount >= 3) {
                localStorage.removeItem('drawnCardName');
                alert('🛠️ 초기화 완료!');
                setTimeout(() => { location.reload(); }, 500);
            }
            
            resetTimer = setTimeout(() => { resetClickCount = 0; }, 2000);
        }
    </script>
</body>
</html>
