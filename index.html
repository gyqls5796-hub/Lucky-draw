<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 💡 수정됨: 모바일에서 더블 탭 확대 방지를 위해 maximum-scale=1.0, user-scalable=no 추가 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>건강 타로 카드 뽑기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a2e;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
            color: white;
            /* 아이폰 텍스트 선택 방지 */
            -webkit-user-select: none;
            user-select: none;
        }

        .header-text {
            margin-bottom: 40px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .card-container {
            display: flex;
            gap: 20px;
            position: relative;
        }

        .card {
            width: 160px;
            height: 260px;
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.4s;
            position: relative;
            transform-origin: center center;
            --move-x: 0px;
            --move-y: 0px;
            /* 모바일 터치 하이라이트 제거 */
            -webkit-tap-highlight-color: transparent;
        }

        .card.active {
            transform: translate(var(--move-x), var(--move-y)) scale(2.6);
            z-index: 100;
        }

        .card-container.has-active .card:not(.active) {
            opacity: 0;
            pointer-events: none;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-style: preserve-3d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-radius: 15px;
        }

        .card.active .card-inner, .result-card .card-inner {
            transform: rotateY(180deg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .card-front {
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            border: 2px solid #f39c12;
            color: #f39c12;
            font-size: 40px;
        }

        .card-front::after {
            content: "✨";
        }

        .card-back {
            background: #ffffff;
            color: #333;
            transform: rotateY(180deg);
            border: 2px solid #ddd;
        }

        .card-icon { font-size: 50px; margin-bottom: 10px; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: #2c3e50; }
        .card-desc { font-size: 11px; color: #666; word-break: keep-all; line-height: 1.4; }

        #resultScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #1a1a2e;
            z-index: 200;
            gap: 250px; 
            padding-bottom: 60px; 
            box-sizing: border-box;
        }

        .result-message {
            font-size: 24px;
            color: #f39c12;
            font-weight: bold;
            text-align: center;
            line-height: 1.5;
            z-index: 201;
            /* 💡 수정됨: iOS 사파리가 버튼으로 인식하도록 커서 포인터 추가 및 하이라이트 제거 */
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            padding: 10px; /* 터치 영역 확보 */
        }

        .result-message span {
            font-size: 16px;
            color: #ffffff;
            font-weight: normal;
        }

        .result-card {
            transform: scale(2.6);
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .card-container { gap: 12px; }
            .card { width: 100px; height: 160px; }
            .card.active { transform: translate(var(--move-x), var(--move-y)) scale(3.2); }
            .card-icon { font-size: 35px; margin-bottom: 5px; }
            .card-title { font-size: 13px; margin-bottom: 4px; }
            .card-desc { font-size: 9px; }
            .result-card { transform: scale(3.2); }
            
            #resultScreen { 
                gap: 220px; 
                padding-bottom: 80px;
            }
            .result-message { font-size: 20px; }
            .result-message span { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="header-text" id="headerText">
        당신의 건강 타로를 1장 뽑아보세요
    </div>

    <div class="card-container" id="cardContainer">
        <div class="card" onclick="selectCard(this, '주사기')">
            <div class="card-inner">
                <div class="card-front"></div>
                <div class="card-back">
                    <div class="card-icon">💉</div>
                    <div class="card-title">주사기</div>
                    <div class="card-desc">예방접종을 통해 질병을 미리 예방하세요.</div>
                </div>
            </div>
        </div>

        <div class="card" onclick="selectCard(this, '마스크')">
            <div class="card-inner">
                <div class="card-front"></div>
                <div class="card-back">
                    <div class="card-icon">😷</div>
                    <div class="card-title">마스크</div>
                    <div class="card-desc">기침예절을 지켜 모두의 건강을 보호하세요.</div>
                </div>
            </div>
        </div>

        <div class="card" onclick="selectCard(this, '손과 물')">
            <div class="card-inner">
                <div class="card-front"></div>
                <div class="card-back">
                    <div class="card-icon">🧼</div>
                    <div class="card-title">손과 물</div>
                    <div class="card-desc">흐르는 물에 비누로 30초 이상 손씻기!</div>
                </div>
            </div>
        </div>
    </div>

    <div id="resultScreen">
        <!-- 텍스트 영역을 터치하면 초기화 실행 -->
        <div class="result-message" onclick="secretReset()">
            이미 참여하셨습니다!<br>
            <span>진행요원에게 이 화면을 보여주시고 선물을 수령하세요.</span>
        </div>
        
        <div class="card result-card">
            <div class="card-inner">
                <div class="card-front"></div>
                <div class="card-back" style="border: 3px solid #f39c12;">
                    <div class="card-icon" id="finalIcon"></div>
                    <div class="card-title" id="finalTitle"></div>
                    <div class="card-desc" id="finalDesc"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbzdztwuybf2EGffQ1d_F9ezHOZhrDplzhksRNaRsqwtH68YTpyIMtfttTH8P7khHgRw/exec"; 

        const cardsData = {
            '주사기': { icon: '💉', desc: '예방접종을 통해 질병을 미리 예방하세요.' },
            '마스크': { icon: '😷', desc: '기침예절을 지켜 모두의 건강을 보호하세요.' },
            '손과 물': { icon: '🧼', desc: '흐르는 물에 비누로 30초 이상 손씻기!' }
        };

        window.onload = function() {
            const savedCardName = localStorage.getItem('drawnCardName');
            
            if (savedCardName && cardsData[savedCardName]) {
                document.getElementById('cardContainer').style.display = 'none';
                document.getElementById('headerText').style.display = 'none';
                
                document.getElementById('finalIcon').innerText = cardsData[savedCardName].icon;
                document.getElementById('finalTitle').innerText = savedCardName;
                document.getElementById('finalDesc').innerText = cardsData[savedCardName].desc;

                document.getElementById('resultScreen').style.display = 'flex';
            }
        };

        let isDrawing = false; 

        function selectCard(selectedCard, cardName) {
            if (isDrawing || localStorage.getItem('drawnCardName')) return;
            isDrawing = true;

            const container = document.getElementById('cardContainer');
            const header = document.getElementById('headerText');
            
            const rect = selectedCard.getBoundingClientRect();
            const cardCenterX = rect.left + (rect.width / 2);
            const cardCenterY = rect.top + (rect.height / 2);
            const screenCenterX = window.innerWidth / 2;
            const screenCenterY = window.innerHeight / 2;
            
            selectedCard.style.setProperty('--move-x', (screenCenterX - cardCenterX) + 'px');
            selectedCard.style.setProperty('--move-y', (screenCenterY - cardCenterY) + 'px');

            selectedCard.classList.add('active');
            container.classList.add('has-active');
            
            localStorage.setItem('drawnCardName', cardName);

            header.style.opacity = '0';
            setTimeout(() => {
                header.innerText = cardName + " 카드를 뽑으셨습니다!";
                header.style.opacity = '1';
            }, 300);

            const formData = new FormData();
            formData.append('cardName', cardName);

            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors',
                body: formData
            })
            .catch(error => console.error('에러 발생!', error));
        }

        // 💡 수정됨: 터치 이벤트가 안정적으로 카운트되도록 타이머 초기화 로직 보강
        let resetClickCount = 0;
        let resetTimer;

        function secretReset() {
            resetClickCount++;
            
            // 기존 타이머를 지우고 새로 설정하여 카운트가 중간에 끊기지 않도록 함
            clearTimeout(resetTimer); 
            
            if (resetClickCount >= 3) {
                localStorage.removeItem('drawnCardName');
                alert('🛠️ 진행요원 기능: 초기화되었습니다.');
                location.reload(); 
            }
            
            // 2초 내에 다음 터치가 없으면 카운트를 0으로 초기화
            resetTimer = setTimeout(() => {
                resetClickCount = 0;
            }, 2000);
        }
    </script>

</body>
</html>
