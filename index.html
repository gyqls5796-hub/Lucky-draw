<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건강 타로 카드 뽑기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a2e;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
            color: white;
        }

        .header-text {
            margin-bottom: 40px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .card-container {
            display: flex;
            gap: 20px;
            position: relative;
        }

        .card {
            width: 160px;
            height: 260px;
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.4s;
            position: relative;
            transform-origin: center center;
            --move-x: 0px;
            --move-y: 0px;
        }

        .card.active {
            transform: translate(var(--move-x), var(--move-y)) scale(2.6);
            z-index: 100;
        }

        .card-container.has-active .card:not(.active) {
            opacity: 0;
            pointer-events: none;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-style: preserve-3d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-radius: 15px;
        }

        .card.active .card-inner {
            transform: rotateY(180deg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .card-front {
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            border: 2px solid #f39c12;
            color: #f39c12;
            font-size: 40px;
        }

        .card-front::after {
            content: "✨";
        }

        .card-back {
            background: #ffffff;
            color: #333;
            transform: rotateY(180deg);
            border: 2px solid #ddd;
        }

        .card-icon { font-size: 50px; margin-bottom: 10px; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: #2c3e50; }
        .card-desc { font-size: 11px; color: #666; word-break: keep-all; line-height: 1.4; }

        #alreadyParticipated {
            display: none;
            font-size: 20px;
            color: #f39c12;
            font-weight: bold;
            text-align: center;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .card-container { gap: 12px; }
            .card { width: 100px; height: 160px; }
            .card.active { transform: translate(var(--move-x), var(--move-y)) scale(3.2); }
            .card-icon { font-size: 35px; margin-bottom: 5px; }
            .card-title { font-size: 13px; margin-bottom: 4px; }
            .card-desc { font-size: 9px; }
        }
    </style>
</head>
<body>

    <div class="header-text" id="headerText">
        당신의 건강 타로를 1장 뽑아보세요
    </div>

    <!-- 이미 참여한 유저에게 보여줄 메시지 -->
    <div id="alreadyParticipated">
        이미 이벤트에 참여하셨습니다!<br>선물 수령처로 이동해 주세요.
    </div>

    <div class="card-container" id="cardContainer">
        <!-- 클릭 시 어떤 카드를 뽑았는지 이름을 같이 넘겨줍니다 -->
        <div class="card" onclick="selectCard(this, '주사기')">
            <div class="card-inner">
                <div class="card-front"></div>
                <div class="card-back">
                    <div class="card-icon">💉</div>
                    <div class="card-title">주사기</div>
                    <div class="card-desc">예방접종을 통해 질병을 미리 예방하세요.</div>
                </div>
            </div>
        </div>

        <div class="card" onclick="selectCard(this, '마스크')">
            <div class="card-inner">
                <div class="card-front"></div>
                <div class="card-back">
                    <div class="card-icon">😷</div>
                    <div class="card-title">마스크</div>
                    <div class="card-desc">기침예절을 지켜 모두의 건강을 보호하세요.</div>
                </div>
            </div>
        </div>

        <div class="card" onclick="selectCard(this, '손과 물')">
            <div class="card-inner">
                <div class="card-front"></div>
                <div class="card-back">
                    <div class="card-icon">🧼</div>
                    <div class="card-title">손과 물</div>
                    <div class="card-desc">흐르는 물에 비누로 30초 이상 손씻기!</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 전달해주신 구글 웹 앱 URL이 적용되었습니다.
        const scriptURL = "https://script.google.com/macros/s/AKfycbzdztwuybf2EGffQ1d_F9ezHOZhrDplzhksRNaRsqwtH68YTpyIMtfttTH8P7khHgRw/exec"; 

        // 페이지가 열릴 때 이미 참여한 기록이 있는지 확인합니다.
        window.onload = function() {
            if (localStorage.getItem('hasDrawnTarot')) {
                document.getElementById('cardContainer').style.display = 'none';
                document.getElementById('headerText').style.display = 'none';
                document.getElementById('alreadyParticipated').style.display = 'block';
            }
        };

        let isDrawing = false; // 중복 클릭 방지용 변수

        function selectCard(selectedCard, cardName) {
            // 이미 뽑는 중이거나 새로고침 꼼수를 썼다면 차단
            if (isDrawing || localStorage.getItem('hasDrawnTarot')) return;
            isDrawing = true;

            const container = document.getElementById('cardContainer');
            const header = document.getElementById('headerText');
            
            // 중앙 이동 거리 계산
            const rect = selectedCard.getBoundingClientRect();
            const cardCenterX = rect.left + (rect.width / 2);
            const cardCenterY = rect.top + (rect.height / 2);
            const screenCenterX = window.innerWidth / 2;
            const screenCenterY = window.innerHeight / 2;
            
            selectedCard.style.setProperty('--move-x', (screenCenterX - cardCenterX) + 'px');
            selectedCard.style.setProperty('--move-y', (screenCenterY - cardCenterY) + 'px');

            // 애니메이션 실행
            selectedCard.classList.add('active');
            container.classList.add('has-active');
            
            // 스마트폰에 "이 사람은 뽑았다"는 기록을 남김 (새로고침 방지)
            localStorage.setItem('hasDrawnTarot', 'true');

            // 상단 텍스트 변경
            header.style.opacity = '0';
            setTimeout(() => {
                header.innerText = cardName + " 카드를 뽑으셨습니다!";
                header.style.opacity = '1';
            }, 300);

            // 구글 스프레드시트로 데이터 전송
            const formData = new FormData();
            formData.append('cardName', cardName);

            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', // CORS 보안 에러 방지
                body: formData
            })
            .then(() => console.log('시트에 저장 완료 요청 전송됨'))
            .catch(error => console.error('에러 발생!', error));
        }
    </script>

</body>
</html>
